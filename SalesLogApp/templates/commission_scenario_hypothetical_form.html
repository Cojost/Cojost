{% extends 'SalesLogApp/base.html' %}
{% block title %}Edit Hypothetical Deal{% endblock %}
{% block content %}
<div class="intro"><h2>Edit Hypothetical Deal</h2><p>This deal exists only inside {{ sandbox.scenario_name }}.</p></div>
<section class="card">
  <form method="post">
    {% csrf_token %}{{ form.as_p }}
    <div class="scenario-actions">
      <button class="button button-primary" type="submit">Save hypothetical deal</button>
      <a class="button button-secondary" href="{% url 'commission_sandbox_detail' sandbox.public_id %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
