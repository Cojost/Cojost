{% if sale.vehicle %}<dialog id="vehicle-{{ sale.pk }}" class="vehicle-dialog" aria-labelledby="vehicle-title-{{ sale.pk }}"><div class="vehicle-dialog-header"><h3 id="vehicle-title-{{ sale.pk }}">Vehicle details</h3><button type="button" class="vehicle-dialog-close" aria-label="Close vehicle details">&times;</button></div><dl><dt>Year</dt><dd>{{ sale.vehicle.year }}</dd><dt>Make</dt><dd>{{ sale.vehicle.make.name }}</dd><dt>Model</dt><dd>{{ sale.vehicle.model.name }}</dd><dt>Mileage</dt><dd>{{ sale.vehicle.mileage|floatformat:"0g" }}</dd><dt>Stock number</dt><dd>{{ sale.vehicle.stock_number }}</dd><dt>VIN</dt><dd>{{ sale.vehicle.vin }}</dd></dl></dialog>{% endif %}
